name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment variables and signing keystore
        env:
          GH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_WHATSAPP_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          # Start from .env.example so all required properties exist with valid default values
          cp .env.example .env

          # If GitHub repository secret exists, override with real key
          if [ -n "$GH_GEMINI_KEY" ]; then
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GH_GEMINI_KEY|" .env
          fi
          if [ -n "$GH_WHATSAPP_KEY" ]; then
            sed -i "s|^WHATSAPP_API_KEY=.*|WHATSAPP_API_KEY=$GH_WHATSAPP_KEY|" .env
          fi

          # Keystore setup for debug APK signing
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true -Dfile.encoding=UTF-8' -Djava.awt.headless=true"
        run: gradle assembleDebug --no-daemon --stacktrace -Pksp.useKSP2=true -Djava.awt.headless=true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C9-SHANICE-AI-AGENT-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
